    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none; /* Prevents bounce effect on mobile */
        }
        
        /* Hide scrollbar for clean UI */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .input-group:focus-within {
            transform: scale(1.02);
            border-color: #FF6B6B;
            box-shadow: 0 4px 20px rgba(255, 107, 107, 0.2);
        }

        /* Animation for numbers */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-result {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>

<body class="bg-gradient-to-br from-orange-400 via-red-400 to-pink-500 min-h-screen flex flex-col items-center justify-center p-4 text-slate-800">

    <!-- App Container -->
    <div class="glass-panel w-full max-w-sm rounded-3xl p-6 relative overflow-hidden">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-orange-600 to-red-600">
                    Energy
                </h1>
                <p class="text-slate-400 text-xs font-medium tracking-wider">KJ <i class="fa-solid fa-arrow-right-arrow-left mx-1 text-[10px]"></i> CAL</p>
            </div>
            <button onclick="toggleInfo()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 hover:bg-slate-200 flex items-center justify-center transition-colors">
                <i class="fa-solid fa-question text-sm"></i>
            </button>
        </div>

        <!-- Inputs Container -->
        <div class="space-y-6">
            
            <!-- Kilojoules Input -->
            <div class="input-group transition-all duration-300 border-2 border-transparent bg-slate-50 rounded-2xl p-4">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-1">Kilojoules (kJ)</label>
                <div class="flex items-center">
                    <input type="number" id="kj-input" placeholder="0" inputmode="decimal" 
                        class="w-full bg-transparent text-3xl font-bold text-slate-700 focus:outline-none placeholder-slate-200"
                        oninput="convert('kj')">
                    <span class="text-slate-300 font-light text-xl">kJ</span>
                </div>
            </div>

            <!-- Arrow Icon -->
            <div class="flex justify-center -my-3 relative z-10">
                <div class="bg-white rounded-full p-2 shadow-md text-orange-500">
                    <i class="fa-solid fa-fire"></i>
                </div>
            </div>

            <!-- Calories Input -->
            <div class="input-group transition-all duration-300 border-2 border-transparent bg-slate-50 rounded-2xl p-4">
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-1">Calories (kcal)</label>
                <div class="flex items-center">
                    <input type="number" id="cal-input" placeholder="0" inputmode="decimal" 
                        class="w-full bg-transparent text-3xl font-bold text-slate-700 focus:outline-none placeholder-slate-200"
                        oninput="convert('cal')">
                    <span class="text-slate-300 font-light text-xl">Cal</span>
                </div>
            </div>

        </div>

        <!-- Action Buttons -->
        <div class="mt-8 grid grid-cols-2 gap-3">
            <button onclick="clearInputs()" class="col-span-2 py-3 rounded-xl bg-slate-100 text-slate-500 font-semibold hover:bg-slate-200 transition-colors flex items-center justify-center gap-2">
                <i class="fa-solid fa-rotate-left"></i> Reset
            </button>
        </div>

    </div>

    <!-- How to Install Overlay -->
    <div id="info-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300" onclick="toggleInfo()">
        <div class="bg-white rounded-3xl p-6 max-w-xs w-full shadow-2xl transform scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
            <div class="flex justify-between items-start mb-4">
                <h3 class="text-lg font-bold text-slate-800">Add to Home Screen</h3>
                <button onclick="toggleInfo()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-4 text-sm text-slate-600">
                <div class="flex items-start gap-3">
                    <div class="bg-blue-100 text-blue-600 w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0">
                        <i class="fa-brands fa-apple"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-slate-800">iPhone / iPad</p>
                        <p class="mt-1">Tap the <strong>Share</strong> button <i class="fa-solid fa-arrow-up-from-bracket"></i>, scroll down and tap <strong>"Add to Home Screen"</strong>.</p>
                    </div>
                </div>

                <div class="flex items-start gap-3">
                    <div class="bg-green-100 text-green-600 w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0">
                        <i class="fa-brands fa-android"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-slate-800">Android</p>
                        <p class="mt-1">Tap the <strong>Menu</strong> icon (3 dots), then select <strong>"Add to Home Screen"</strong> or "Install App".</p>
                    </div>
                </div>
            </div>
            
            <button onclick="toggleInfo()" class="mt-6 w-full py-3 bg-slate-900 text-white rounded-xl font-semibold">Got it</button>
        </div>
    </div>

    <script>
        const kjInput = document.getElementById('kj-input');
        const calInput = document.getElementById('cal-input');
        const modal = document.getElementById('info-modal');
        const modalContent = modal.querySelector('div');

        // Conversion Factor: 1 kcal = 4.184 kJ
        const FACTOR = 4.184;

        function convert(source) {
            let val = 0;
            
            if (source === 'kj') {
                val = parseFloat(kjInput.value);
                if (isNaN(val)) {
                    calInput.value = '';
                    return;
                }
                // Convert kJ to Cal
                let result = val / FACTOR;
                calInput.value = formatNumber(result);
            } else {
                val = parseFloat(calInput.value);
                if (isNaN(val)) {
                    kjInput.value = '';
                    return;
                }
                // Convert Cal to kJ
                let result = val * FACTOR;
                kjInput.value = formatNumber(result);
            }
        }

        function formatNumber(num) {
            // Avoid long decimals, but keep precision if small number
            return Math.round(num * 100) / 100;
        }

        function clearInputs() {
            kjInput.value = '';
            calInput.value = '';
            kjInput.focus();
        }

        function toggleInfo() {
            if (modal.classList.contains('hidden')) {
                // Open
                modal.classList.remove('hidden');
                // Small timeout to allow display:block to apply before opacity transition
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modalContent.classList.remove('scale-95');
                    modalContent.classList.add('scale-100');
                }, 10);
            } else {
                // Close
                modal.classList.add('opacity-0');
                modalContent.classList.remove('scale-100');
                modalContent.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }
        }
    </script>
</body>
